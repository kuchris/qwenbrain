[project]
name = "qwenbrain"
version = "0.1.0"
description = "Local Qwen chat and per-message adaptation experiments."
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.11.0",
    "transformers==5.16.1",
    "huggingface-hub==1.30.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
